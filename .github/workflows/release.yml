name: Release image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/livvux/pfotenweb:${{ github.ref_name }}-${{ matrix.arch }}
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/livvux/pfotenweb:$RELEASE_TAG" "ghcr.io/livvux/pfotenweb:$RELEASE_TAG-amd64" "ghcr.io/livvux/pfotenweb:$RELEASE_TAG-arm64"
